name: Monitor de Contratos - Taguaí
on:
  schedule:
    - cron: '0 11 * * 1-5'  # 08:00 horário de Brasília (UTC-3), seg-sex
  workflow_dispatch: {}       # permite rodar manualmente para testar

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza estado de contratos [skip ci]"
          file_pattern: "data/contratos.db"
